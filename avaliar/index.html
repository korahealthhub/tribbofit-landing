<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribbo Fit | Avaliar</title>
<meta name="description" content="Avalie o Tribbo Fit na App Store ou no Google Play.">
<meta name="robots" content="noindex">
<link rel="icon" href="../app-icon-tribbo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
a{color:inherit;text-decoration:none}

body{
  font-family:'Manrope',system-ui,sans-serif;
  background:#07161B;
  color:#F5F0E6;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
}

.logo{
  height:28px;
  object-fit:contain;
  filter:brightness(0) invert(1);
  opacity:.88;
  margin-bottom:32px;
}

.title{
  font-size:22px;
  font-weight:800;
  line-height:1.3;
  text-align:center;
  max-width:320px;
  margin-bottom:8px;
}
.subtitle{
  font-size:15px;
  color:rgba(245,240,230,0.55);
  line-height:1.5;
  text-align:center;
  max-width:320px;
  margin-bottom:32px;
}

/* No celular: aviso enquanto a loja abre */
@keyframes spin{to{transform:rotate(360deg)}}
.redirect{display:none;flex-direction:column;align-items:center;margin-bottom:32px}
body.is-mobile .redirect{display:flex}
.spinner{
  width:36px;height:36px;
  border:3px solid rgba(237,251,107,0.18);
  border-top-color:#EDFB6B;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:16px;
}
.status{
  font-size:15px;
  font-weight:600;
  color:rgba(245,240,230,0.55);
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
  max-width:320px;
}
.label{
  font-size:11px;
  font-weight:600;
  color:rgba(245,240,230,0.35);
  text-align:center;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:4px;
  display:none;
}
body.is-mobile .label{display:block}

.btn{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  color:#F5F0E6;
  transition:background .18s,border-color .18s,transform .18s;
}
.btn:hover{
  background:rgba(237,251,107,0.09);
  border-color:rgba(237,251,107,0.25);
  transform:translateY(-1px);
}
.btn-icon{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:10px;
  background:rgba(237,251,107,0.12);
  color:#EDFB6B;
  flex-shrink:0;
}
.btn-body{display:flex;flex-direction:column;gap:2px}
.btn-label{font-size:14px;font-weight:700;color:#F5F0E6}
.btn-caption{font-size:12px;color:rgba(245,240,230,0.45)}
</style>
</head>
<body>

<img src="../nome-branco.png" class="logo" alt="Tribbo Fit">

<h1 class="title">Sua avaliação ajuda muito</h1>
<p class="subtitle">Conte o que achou do Tribbo Fit. Leva menos de um minuto.</p>

<!-- Celular: a loja abre sozinha; os botões ficam como reserva -->
<div class="redirect" aria-live="polite">
  <div class="spinner"></div>
  <p class="status">Abrindo a loja...</p>
</div>

<div class="buttons">
  <p class="label">Se a loja não abrir, toque abaixo</p>

  <a id="btn-ios" class="btn" href="https://apps.apple.com/br/app/id6769632514?action=write-review" rel="noopener">
    <span class="btn-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
    </span>
    <span class="btn-body">
      <span class="btn-label">Avaliar na App Store</span>
      <span class="btn-caption">iPhone e iPad</span>
    </span>
  </a>

  <a id="btn-android" class="btn" href="https://play.google.com/store/apps/details?id=com.usekoraapp.health" rel="noopener">
    <span class="btn-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.18 23.76c.3.17.65.19.97.07l11.65-6.74-2.5-2.5-10.12 9.17zm-1.12-20.3A1.5 1.5 0 0 0 2 4.5v15a1.5 1.5 0 0 0 .06.54l10.44-9.54L2.06 3.46zM20.1 9.24l-2.5-1.44-2.8 2.56 2.8 2.8 2.52-1.46a1.5 1.5 0 0 0 0-2.46zM4.15.24a1 1 0 0 0-.97.07L13.3 9.58l2.5-2.5L4.15.24z"/>
      </svg>
    </span>
    <span class="btn-body">
      <span class="btn-label">Avaliar no Google Play</span>
      <span class="btn-caption">Android</span>
    </span>
  </a>
</div>

<script>
  // Sem rastreamento: só decide para qual loja mandar.
  (function () {
    var ua = navigator.userAgent || '';
    // iPad com iPadOS 13 ou mais se apresenta como Mac; o toque denuncia.
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (!isIOS && !isAndroid) return; // computador: só os dois botões

    document.body.classList.add('is-mobile');
    var target = isIOS
      ? document.getElementById('btn-ios').href
      : document.getElementById('btn-android').href;
    window.location.replace(target);
  })();
</script>

</body>
</html>
